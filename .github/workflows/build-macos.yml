name: Build MoneyMap (macOS)

# Builds the native SwiftUI app on a genuine macOS runner, runs the tests,
# archives a Release .app, packages it into a DMG and uploads both.
# No code signing or notarisation: the DMG contains an unsigned build.
# On first launch macOS Gatekeeper will ask the user to right-click the app
# and choose Open once. See BUILD.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PROJECT: MoneyMap.xcodeproj
      SCHEME: MoneyMap
      DESTINATION: platform=macOS,arch=arm64
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Extract MoneyMap source (bulk push is blocked, source is in moneymap-source.zip.b64.part-*)
        run: |
          if ls moneymap-source.zip.b64.part-* 1> /dev/null 2>&1; then
            cat moneymap-source.zip.b64.part-* > moneymap-source.zip.b64
            python3 -m base64 -d moneymap-source.zip.b64 > /tmp/moneymap.zip
            unzip -o -q /tmp/moneymap.zip
            # Zip contains moneymap/ as top folder; move its contents to repo root
            cp -R moneymap/. .
            rm -rf moneymap /tmp/moneymap.zip
            ls -la
            test -f MoneyMap.xcodeproj/project.pbxproj
          else
            echo "No source parts found, using files already in repo"
          fi

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('MoneyMap.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate app icons (PNGs are not committed via snapshot push)
        run: |
          ls -lh MoneyMap/Resources/Assets.xcassets/AppIcon.appiconset/

      - name: Resolve package dependencies (GRDB.swift)
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build (Release, arm64, unsigned)
        run: |
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "$DESTINATION" -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        id: test
        continue-on-error: true
        run: |
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "$DESTINATION" -configuration Debug \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMap-TestResults
          path: build/TestResults.xcresult
          if-no-files-found: warn

      - name: Fail the job if tests failed
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::xcodebuild test failed — see the TestResults artifact. Fix the failing tests; do not disable them."
          exit 1

      - name: Archive (Release, unsigned)
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "$DESTINATION" -configuration Release \
            -archivePath build/MoneyMap.xcarchive \
            CODE_SIGNING_ALLOWED=NO
          ditto build/MoneyMap.xcarchive/Products/Applications/MoneyMap.app build/MoneyMap.app

      - name: Verify the .app bundle
        run: |
          test -d build/MoneyMap.app
          echo "Bundle identifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/MoneyMap.app/Contents/Info.plist)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/MoneyMap.app/Contents/Info.plist)" = "com.moneymap.desktop"
          echo "Architectures: $(lipo -archs build/MoneyMap.app/Contents/MacOS/MoneyMap)"
          lipo -archs build/MoneyMap.app/Contents/MacOS/MoneyMap | grep -q arm64
          ls -la build/MoneyMap.app/Contents/MacOS/

      - name: Create DMG
        run: |
          rm -rf build/dmg-staging && mkdir -p build/dmg-staging
          ditto build/MoneyMap.app build/dmg-staging/MoneyMap.app
          ln -s /Applications build/dmg-staging/Applications
          hdiutil create -volname MoneyMap \
            -srcfolder build/dmg-staging \
            -ov -format UDZO build/MoneyMap.dmg
          hdiutil verify build/MoneyMap.dmg
          ls -lh build/MoneyMap.dmg

      - name: Zip the .app for download
        run: |
          cd build && ditto -c -k --sequesterRsrc --keepParent MoneyMap.app MoneyMap.app.zip
          ls -lh MoneyMap.app.zip

      - name: Upload MoneyMap.dmg
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMap.dmg
          path: build/MoneyMap.dmg
          if-no-files-found: error

      - name: Upload MoneyMap.app (zip)
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMap.app.zip
          path: build/MoneyMap.app.zip
          if-no-files-found: error
